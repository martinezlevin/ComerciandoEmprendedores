<!doctype html>
<html lang="es-AR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f6ff" />
    <script>
      try {
        const savedTheme = localStorage.getItem(
          "comerciando_emprendedores_theme_v1",
        );
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {}
    </script>
    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Comerciando — Andes Solutions</title>
    <meta
      name="description"
      content="Sistema integral del plan Emprendedores, basado en el diseño Executive Navy de comercIAndo Negocios."
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="remake-ready lite-sidebar-pinned" data-view="home">
    <aside id="side">
      <div class="brand">
        <div class="logo">
          <img src="img/logo.png" alt="Comerciando" />
        </div>
        <div><b>Comerciando</b><small>by Andes Solutions</small></div>
      </div>
      <div class="plan">
        <b>EMPRENDEDORES</b
        ><span style="font-size: 10px; margin-left: auto">PRO v1.0.0</span>
      </div>
      <nav id="nav" aria-label="Navegación principal"></nav>
      <div class="lite-prefs">
        <button
          type="button"
          class="side-control"
          data-pref="theme"
          title="Cambiar tema"
        >
          <span class="pref-icon" id="themeIcon" aria-hidden="true"></span
          ><span class="pref-label" id="themeName">Tema: oscuro</span>
        </button>
        <div
          class="lite-menu-picks"
          role="group"
          aria-label="Modo del menú lateral"
        >
          <button
            type="button"
            class="side-control"
            data-litemenu="fixed"
            title="Menú fijo"
            aria-pressed="true"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
              <path d="m14 9 3 3-3 3" /></svg
            ><span>Fijo</span></button
          ><button
            type="button"
            class="side-control"
            data-litemenu="compact"
            title="Solo íconos"
            aria-pressed="false"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
              <path d="m16 15-3-3 3-3" /></svg
            ><span>Íconos</span></button
          ><button
            type="button"
            class="side-control"
            data-litemenu="auto"
            title="Autoocultar"
            aria-pressed="false"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" /></svg
            ><span>Auto</span>
          </button>
        </div>
        <button
          type="button"
          class="side-control"
          data-pref="sound"
          title="Activar o desactivar sonido"
        >
          <span class="pref-icon" id="soundIcon" aria-hidden="true"></span
          ><span class="pref-label" id="soundName">Sonido activado</span>
        </button>
      </div>
      <div class="me">
        <div class="av" id="meAvatar">IN</div>
        <div style="min-width: 0">
          <b id="storeNameSide">Mi emprendimiento</b>
          <small id="userCountSide">Plan Emprendedor · 1/3</small>
        </div>
      </div>
    </aside>
    <div class="wrap">
      <header class="top">
        <button class="burger" id="bg" aria-label="Abrir menú" type="button">
          ☰
        </button>
        <div class="v8-userbadge" id="topUserBadge">
          <span class="v8-usercircle" id="topUserCircle">IN</span>
          <span><b id="topUserName">Invitado</b><small id="topUserRole">Administrador</small></span>
        </div>
        <div class="crumb" id="crumb">
          Comerciando Emprendedores · <b>Inicio</b>
        </div>
        <div class="nav-search-wrap">
          <form class="nav-search-form" id="navSearchForm" role="search" onsubmit="event.preventDefault();">
            <input
              type="text"
              id="navSearchInput"
              class="nav-search-input"
              placeholder="Buscar producto, venta, cliente… (Ctrl+K)"
              aria-label="Buscar producto, venta, cliente y entrega"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              type="submit"
              id="navSearchBtn"
              class="nav-search-btn"
              title="Buscar en el negocio (Ctrl+K o /)"
              aria-label="Buscar"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            </button>
          </form>
        </div>
        <div class="top-right">
          <button
            type="button"
            class="plan-tag-btn"
            id="planBadgeBtn"
            title="Tenés acceso por 7 días gratis"
            aria-label="Plan Emprendedor: Tenés acceso por 7 días gratis"
          >
            PLAN EMPRENDEDOR
          </button>
          <button class="btn g sm w" id="cashHeader" type="button">
            ○ Caja cerrada
          </button>
        </div>
      </header>
      <main id="m"><div class="in" id="v"></div></main>
    </div>
    <div class="remake-overlay" id="overlay"></div>
    <div id="modal" class="lite-modal" role="presentation">
      <section
        class="lite-modal-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="lite-modal-head">
          <div>
            <h2 id="modalTitle"></h2>
            <p class="lite-note" id="modalSubtitle"></p>
          </div>
          <button
            type="button"
            class="btn g sm"
            id="modalX"
            aria-label="Cerrar"
          >
            ✕
          </button>
        </div>
        <div class="lite-modal-content" id="modalBody"></div>
        <div class="lite-modal-foot" id="modalActions"></div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
