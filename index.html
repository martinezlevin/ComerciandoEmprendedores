<!doctype html>
<html lang="es-AR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f6ff" />
    <script>
      try {
        const savedTheme = localStorage.getItem(
          "comerciando_emprendedores_theme_v1",
        );
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {}
    </script>
    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Comerciando — Andes Solutions</title>
    <meta
      name="description"
      content="Sistema integral del plan Emprendedores, basado en el diseño Executive Navy de comercIAndo Negocios."
    />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="remake-ready lite-sidebar-pinned" data-view="home">
    <aside id="side">
      <div class="brand">
        <div class="logo">
          <img src="img/logo.png" alt="Comerciando" />
        </div>
        <div><b>Comerciando</b><small>by Andes Solutions</small></div>
      </div>
      <div class="plan">
        <b>EMPRENDEDORES</b
        ><span style="font-size: 10px; margin-left: auto">PRO v1.0.0</span>
      </div>
      <nav id="nav" aria-label="Navegación principal"></nav>
      <div class="lite-prefs">
        <button
          type="button"
          class="side-control"
          data-pref="theme"
          title="Cambiar tema"
        >
          <span class="pref-icon" id="themeIcon" aria-hidden="true"></span
          ><span class="pref-label" id="themeName">Tema: oscuro</span>
        </button>
        <div
          class="lite-menu-picks"
          role="group"
          aria-label="Modo del menú lateral"
        >
          <button
            type="button"
            class="side-control"
            data-litemenu="fixed"
            title="Menú fijo"
            aria-pressed="true"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
              <path d="m14 9 3 3-3 3" /></svg
            ><span>Fijo</span></button
          ><button
            type="button"
            class="side-control"
            data-litemenu="compact"
            title="Solo íconos"
            aria-pressed="false"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
              <path d="m16 15-3-3 3-3" /></svg
            ><span>Íconos</span></button
          ><button
            type="button"
            class="side-control"
            data-litemenu="auto"
            title="Autoocultar"
            aria-pressed="false"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" /></svg
            ><span>Auto</span>
          </button>
        </div>
        <button
          type="button"
          class="side-control"
          data-pref="sound"
          title="Activar o desactivar sonido"
        >
          <span class="pref-icon" id="soundIcon" aria-hidden="true"></span
          ><span class="pref-label" id="soundName">Sonido activado</span>
        </button>
        <button
          type="button"
          class="side-control side-logout-btn"
          data-action="logout"
          title="Cerrar sesión"
          aria-label="Cerrar sesión"
        >
          <span class="pref-icon" id="logoutIcon" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-square-arrow-right-enter"
            >
              <path d="M3 12h10" />
              <path d="M3 8V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3" />
              <path d="m9 16 4-4-4-4" />
            </svg>
          </span>
          <span class="pref-label">Cerrar sesión</span>
        </button>
      </div>
    </aside>
    <div class="wrap">
      <header class="top">
        <button class="burger" id="bg" aria-label="Abrir menú" type="button">
          ☰
        </button>
        <div class="v8-userbadge" id="topUserBadge">
          <span class="v8-usercircle" id="topUserCircle">IN</span>
          <span><b id="topUserName">Invitado</b><small id="topUserRole">Administrador</small></span>
        </div>
        <div class="crumb" id="crumb" style="display: none !important;"></div>
        <div class="top-right">
          <div class="nav-search-wrap">
            <form class="nav-search-form uiverse-search-wrapper" id="navSearchForm" role="search" onsubmit="event.preventDefault();">
              <button
                type="submit"
                id="navSearchBtn"
                class="nav-search-btn uiverse-search-icon"
                title="Buscar en el negocio (Ctrl+K o /)"
                aria-label="Buscar"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M11.5 21C16.7467 21 21 16.7467 21 11.5C21 6.25329 16.7467 2 11.5 2C6.25329 2 2 6.25329 2 11.5C2 16.7467 6.25329 21 11.5 21Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                  <path d="M22 22L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </button>
              <input
                type="text"
                id="navSearchInput"
                name="text"
                class="nav-search-input uiverse-search-input"
                placeholder="Buscar… (Ctrl+K)"
                aria-label="Buscar producto, venta, cliente y entrega"
                autocomplete="off"
                spellcheck="false"
              />
            </form>
          </div>
          <button
            class="btn g sm tour-launch-btn"
            id="tourLaunchBtn"
            type="button"
            data-action="start-tour"
            title="Iniciar tutorial guiado"
            aria-label="Iniciar tutorial guiado"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
            <span>Guía</span>
          </button>
          <button class="btn g sm w" id="cashHeader" type="button">
            ○ Caja cerrada
          </button>
        </div>
      </header>
      <main id="m"><div class="in" id="v"></div></main>
    </div>
    <div class="remake-overlay" id="overlay"></div>
    <div id="modal" class="lite-modal" role="presentation">
      <section
        class="lite-modal-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="lite-modal-head">
          <div>
            <h2 id="modalTitle"></h2>
            <p class="lite-note" id="modalSubtitle"></p>
          </div>
          <button
            type="button"
            class="btn g sm"
            id="modalX"
            aria-label="Cerrar"
          >
            ✕
          </button>
        </div>
        <div class="lite-modal-content" id="modalBody"></div>
        <div class="lite-modal-foot" id="modalActions"></div>
      </section>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
